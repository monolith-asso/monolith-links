<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MONOLITH</title>
  <meta name="description" content="MONOLITH - Événements, musique et communauté">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: #080808;
      color: #f5f5f5;
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px 20px;
    }

    .container {
      width: 100%;
      max-width: 520px;
      text-align: center;
    }

    .logo {
      height: auto;
      object-fit: contain;
      margin: 0 auto 24px;
      display: block;
    }

    /* Logo 3 points : conserve les couleurs et le dégradé du SVG */
    .logo-old {
      width: 90px;
    }

    /* Logo définitif : conversion du SVG noir en blanc */
    .logo-new {
      width: min(250px, 70vw);
      filter: brightness(0) invert(1);
    }

    .subtitle {
      color: #999;
      font-size: 14px;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 45px;
    }
    
    .video {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      margin-bottom: 45px;
      border: 1px solid #444;
      border-radius: 4px;
      overflow: hidden;
      background: #000;
    }
    
    .video iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }  

    
    .links {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .link {
      display: block;
      width: 100%;
      padding: 18px 20px;
      border: 1px solid #444;
      border-radius: 4px;
      color: #fff;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      transition: 0.2s ease;
    }

    .link:hover {
      background: #fff;
      color: #080808;
      border-color: #fff;
      transform: translateY(-2px);
    }

    .main-link {
      background: #f5f5f5;
      color: #080808;
      border-color: #f5f5f5;
    }

    .main-link:hover {
      background: transparent;
      color: #fff;
    }

    footer {
      margin-top: 45px;
      color: #555;
      font-size: 11px;
      letter-spacing: 2px;
    }

    @media (max-width: 500px) {
      body {
        padding: 30px 18px;
      }
    }
  </style>
</head>

<body>
  <main class="container">

    <!--
      ================================================================
      CHOIX DU LOGO
      ================================================================

      Pour l'instant, le logo "3 points" est actif.

      Lors de l'annonce du nouveau logo :
      1. commenter la ligne logo-old
      2. décommenter la ligne logo-new

      Ne pas afficher les deux en même temps.
    -->

    <!-- LOGO ACTUEL - 3 POINTS -->
    <img
      class="logo logo-old"
      src="logo_3_points.svg"
      alt="Logo Monolith"
    >

    <!-- NOUVEAU LOGO - décommenter après l'annonce -->
    <!--
    <img
      class="logo logo-new"
      src="monolith_logo.svg"
      alt="Logo Monolith"
    >
    -->

    <div class="subtitle">
      Music - Events - Community
    </div>
  <-- Iframe de la dernière video via le static playlist trick -->
   <div class="video">
      <iframe
        src="https://www.youtube-nocookie.com/embed/videoseries?list=UULFn8e1LUEzf5vIcDg1z9BCLg&rel=0"
        title="Dernière vidéo Monolith"
        loading="lazy"
        allow="accelerator; encrypted-media; picture-in-picture; web-share"
        allowfullscreen
      ></iframe>
    </div>
    
    <div class="links">

      <a
        class="link main-link"
        href="next_event.html"
      >
        Next Event
      </a>

      <a
        class="link"
        href="https://www.instagram.com/monolith_asso/"
        target="_blank"
        rel="noopener noreferrer"
      >
        Instagram
      </a>

      <a
        class="link"
        href="https://www.youtube.com/@monolith_asso"
        target="_blank"
        rel="noopener noreferrer"
      >
        YouTube
      </a>

      <a
        class="link"
        href="mailto:monolith.asso@gmail.com"
      >
        Contact
      </a>

    </div>

    <footer>
      MONOLITH - 2026
    </footer>

  </main>
</body>
</html>
